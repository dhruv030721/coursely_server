
services:
  mongo:
    image: mongo:latest
    container_name: prod-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ys2025
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet --username admin --password ys2025 --authenticationDatabase admin localhost:27017/test
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  mongo_data:
